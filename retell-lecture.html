<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTE Retell Lecture Simulator with AI Key Concept Scoring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-link { text-decoration: none; color: #be185d; font-weight: 700; font-size: 14px; }
    .badge { background: #fce7f3; color: #be185d; padding: 4px 10px; border-radius: 9999px; font-size: 13px; font-weight: 700; }

    .wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    .pte-container {
      background: #ffffff;
      width: 100%;
      max-width: 760px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-top: 6px solid #be185d;
    }
    .pte-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
    }
    .pte-header h2 { font-size: 20px; color: #0f172a; }
    .pte-header p { font-size: 14px; color: #64748b; margin-top: 4px; }

    .question-select {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    .audio-box {
      background: #fdf2f8;
      border: 2px dashed #fbcfe8;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .audio-anim { font-size: 32px; margin-bottom: 6px; }
    .audio-desc { font-size: 14px; font-weight: 600; color: #9d174d; }

    .status-panel {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .status-title {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 14px;
      color: #334155;
      margin-bottom: 8px;
    }
    .progress-bar-container {
      width: 100%;
      height: 12px;
      background-color: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-bar { width: 0%; height: 100%; background-color: #be185d; transition: width 1s linear; }

    .btn-group { display: flex; gap: 12px; }
    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-start { background-color: #be185d; color: white; }
    .btn-start:hover { background-color: #9d174d; }
    .btn-skip { background-color: #f59e0b; color: white; }
    .btn-skip:hover { background-color: #d97706; }
    .btn-stop { background-color: #ef4444; color: white; }
    .btn-stop:hover { background-color: #dc2626; }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .audio-playback { margin-top: 20px; width: 100%; display: none; }

    .score-card {
      display: none;
      margin-top: 24px;
      background: #ffffff;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(190, 24, 93, 0.08);
    }
    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #fdf2f8;
      padding-bottom: 12px;
    }
    .score-header h3 { font-size: 17px; color: #be185d; }
    .overall-badge { font-size: 24px; font-weight: 800; color: #be185d; }

    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .score-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }
    .score-box .label { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .score-box .val { font-size: 20px; font-weight: 700; color: #0f172a; }

    .keyword-pill-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .kw-pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 9999px; }
    .kw-hit { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .kw-miss { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    .analysis-details {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 14px;
    }
    .template-box {
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #831843;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="main.html" class="back-link">&larr; 메인 대시보드로 이동</a>
    <span class="badge">Speaking &bull; Retell Lecture Active</span>
  </div>

  <div class="wrapper">
    <div class="pte-container">
      <div class="pte-header">
        <div>
          <h2>Retell Lecture</h2>
          <p>학술 강의를 듣고 10초 준비 후 40초 내에 핵심 내용을 요약 발화하세요.</p>
        </div>
        <select id="question-selector" class="question-select"></select>
      </div>

      <div class="audio-box" id="audio-box">
        <div class="audio-anim" id="audio-icon">🎧</div>
        <div class="audio-desc" id="audio-desc">[강의 듣기 시작]을 누르면 원어민 학술 강의가 재생됩니다.</div>
      </div>

      <div class="status-panel">
        <div class="status-title">
          <span id="status-label">상태: 대기 중</span>
          <span id="timer-label">00s</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="start-btn">강의 듣기 시작</button>
        <button class="btn btn-skip" id="skip-btn" style="display: none;">준비 건너뛰기 &rarr;</button>
        <button class="btn btn-stop" id="finish-btn" style="display: none;">말하기 완료 (Next)</button>
      </div>

      <audio id="audio-player" class="audio-playback" controls></audio>

      <div class="score-card" id="score-card">
        <div class="score-header">
          <h3>📊 Retell Lecture 채점 결과</h3>
          <div class="overall-badge" id="overall-badge">-- / 90</div>
        </div>
        <div class="score-grid">
          <div class="score-box"><div class="label">핵심 개념 (Content)</div><div class="val" id="content-score">--</div></div>
          <div class="score-box"><div class="label">유창성 (Fluency)</div><div class="val" id="fluency-score">--</div></div>
          <div class="score-box"><div class="label">발음 정확도 (Pron)</div><div class="val" id="pron-score">--</div></div>
        </div>

        <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px;">강의 핵심 키워드 판정:</div>
        <div class="keyword-pill-list" id="keyword-pills"></div>

        <div class="analysis-details" id="analysis-details"></div>
        <div class="template-box" id="template-box"></div>
      </div>
    </div>
  </div>

  <script src="audio-engine.js"></script>
  <script src="questions.js"></script>
  <script>
    const PREP_TIME = 10;
    const REC_TIME = 40;

    let timerInterval = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recognition = null;
    let spokenTranscript = "";
    let confidenceSum = 0;
    let confidenceCount = 0;
    let recordingStartTime = 0;
    let currentItem = null;

    const questionSelector = document.getElementById('question-selector');
    const audioIcon = document.getElementById('audio-icon');
    const audioDesc = document.getElementById('audio-desc');
    const statusLabel = document.getElementById('status-label');
    const timerLabel = document.getElementById('timer-label');
    const progressBar = document.getElementById('progress-bar');
    const startBtn = document.getElementById('start-btn');
    const skipBtn = document.getElementById('skip-btn');
    const finishBtn = document.getElementById('finish-btn');
    const audioPlayer = document.getElementById('audio-player');
    const scoreCard = document.getElementById('score-card');
    const keywordPills = document.getElementById('keyword-pills');
    const analysisDetails = document.getElementById('analysis-details');
    const templateBox = document.getElementById('template-box');

    function loadRl(item) {
      currentItem = item;
      resetTest();
    }

    function resetTest() {
      clearInterval(timerInterval);
      window.speechSynthesis.cancel();
      if (recognition) { try { recognition.stop(); } catch(e){} }
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      audioIcon.innerText = "🎧";
      audioDesc.innerText = "[강의 듣기 시작]을 누르면 원어민 학술 강의가 재생됩니다.";
      statusLabel.innerText = "상태: 대기 중";
      timerLabel.innerText = "00s";
      progressBar.style.width = "0%";
      startBtn.style.display = "inline-block";
      startBtn.disabled = false;
      skipBtn.style.display = "none";
      finishBtn.style.display = "none";
      audioPlayer.style.display = "none";
      scoreCard.style.display = "none";
    }

    async function initAudioAndSTT() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        audioPlayer.src = URL.createObjectURL(audioBlob);
        audioPlayer.style.display = 'block';
      };

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = true;
        recognition.interimResults = false;

        spokenTranscript = "";
        confidenceSum = 0;
        confidenceCount = 0;

        recognition.onresult = (event) => {
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              spokenTranscript += " " + event.results[i][0].transcript;
              if (event.results[i][0].confidence) {
                confidenceSum += event.results[i][0].confidence;
                confidenceCount++;
              }
            }
          }
        };
      }
    }

    startBtn.addEventListener('click', async () => {
      try {
        await initAudioAndSTT();
      } catch (err) {
        alert("마이크 사용 권한을 허용해야 채점이 진행됩니다.");
        return;
      }

      startBtn.disabled = true;
      audioIcon.innerText = "🔊";
      audioDesc.innerText = `강의 재생 중... ("${currentItem.title}") 핵심 키워드를 메모하세요.`;
      statusLabel.innerText = "상태: 강의 청취 중 (Playing...)";

      PTE_AUDIO.speak(currentItem.lecture, () => {
        startPreparation();
      });
    });

    function startPreparation() {
      audioIcon.innerText = "⏳";
      audioDesc.innerText = "강의 종료! 10초 준비 시간 동안 템플릿을 정리하세요.";
      statusLabel.innerText = "상태: 발화 준비 시간 (Beginning in...)";
      skipBtn.style.display = "inline-block";
      progressBar.style.backgroundColor = "#f59e0b";

      let rem = PREP_TIME;
      timerLabel.innerText = `${rem}s`;

      timerInterval = setInterval(() => {
        rem--;
        timerLabel.innerText = `${rem}s`;
        progressBar.style.width = `${((PREP_TIME - rem) / PREP_TIME) * 100}%`;
        if (rem <= 0) {
          clearInterval(timerInterval);
          startRecordingFlow();
        }
      }, 1000);
    }

    skipBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      startRecordingFlow();
    });

    function startRecordingFlow() {
      PTE_AUDIO.playBeep();
      skipBtn.style.display = "none";
      finishBtn.style.display = "inline-block";
      progressBar.style.width = "0%";
      progressBar.style.backgroundColor = "#be185d";

      recordingStartTime = Date.now();
      mediaRecorder.start();
      if (recognition) { try { recognition.start(); } catch(e){} }

      let elapsed = 0;
      audioIcon.innerText = "🎙️";
      audioDesc.innerText = "● 녹음 진행 중! 템플릿에 맞춰 요약 발화하세요.";
      statusLabel.innerText = "상태: ● 요약 발화 녹음 중 (Recording...)";

      timerInterval = setInterval(() => {
        elapsed++;
        timerLabel.innerText = `${elapsed}s / ${REC_TIME}s`;
        progressBar.style.width = `${(elapsed / REC_TIME) * 100}%`;
        if (elapsed >= REC_TIME) {
          clearInterval(timerInterval);
          stopAndEvaluate();
        }
      }, 1000);
    }

    function stopAndEvaluate() {
      clearInterval(timerInterval);
      const actualDuration = Math.max(1, (Date.now() - recordingStartTime) / 1000);

      if (recognition) { try { recognition.stop(); } catch(e){} }
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }

      finishBtn.style.display = 'none';
      startBtn.style.display = 'inline-block';
      startBtn.innerText = "다시 응시하기";
      startBtn.disabled = false;

      statusLabel.innerText = "상태: 채점 완료";
      timerLabel.innerText = "제출됨";
      progressBar.style.width = "100%";
      progressBar.style.backgroundColor = "#10b981";

      setTimeout(() => evaluateRetell(actualDuration), 600);
    }

    finishBtn.addEventListener('click', stopAndEvaluate);

    function evaluateRetell(actualDuration) {
      const lowerSpoken = spokenTranscript.toLowerCase();
      let hitCount = 0;
      let pillsHtml = "";

      currentItem.keywords.forEach(kw => {
        if (lowerSpoken.includes(kw.toLowerCase())) {
          hitCount++;
          pillsHtml += `<span class="kw-pill kw-hit">✔ ${kw}</span>`;
        } else {
          pillsHtml += `<span class="kw-pill kw-miss">✖ ${kw}</span>`;
        }
      });
      keywordPills.innerHTML = pillsHtml;

      const hitRatio = currentItem.keywords.length > 0 ? (hitCount / currentItem.keywords.length) : 0;
      const contentScore = Math.round(10 + Math.min(1.0, hitRatio * 1.25) * 80);

      const userWords = spokenTranscript.split(/\s+/).filter(w => w.length > 0);
      const wpm = Math.round((userWords.length / actualDuration) * 60);

      let fluencyScore = 10;
      if (wpm >= 110 && wpm <= 165) fluencyScore = 85 + Math.min(5, Math.round(hitRatio * 5));
      else if (wpm >= 80 && wpm < 110) fluencyScore = Math.round(60 + ((wpm - 80) / 30) * 25);
      else fluencyScore = Math.max(10, Math.round((wpm / 80) * 60));

      const avgConf = confidenceCount > 0 ? (confidenceSum / confidenceCount) : 0.75;
      const pronScore = Math.round(10 + Math.min(1.0, avgConf * 1.05) * 80);
      const overall = Math.round(contentScore * 0.45 + fluencyScore * 0.35 + pronScore * 0.2);

      document.getElementById('overall-badge').innerText = `${overall} / 90`;
      document.getElementById('content-score').innerText = `${contentScore}점`;
      document.getElementById('fluency-score').innerText = `${fluencyScore}점`;
      document.getElementById('pron-score').innerText = `${pronScore}점`;

      analysisDetails.innerHTML = `
        <b>적중된 핵심 개념:</b> ${hitCount} / ${currentItem.keywords.length}개 (${Math.round(hitRatio * 100)}%)<br>
        <b>발화 속도:</b> ${wpm} WPM (소요 시간: ${actualDuration.toFixed(1)}초, 말한 단어: ${userWords.length}개)<br>
        <b>인식된 음성:</b> "${spokenTranscript.trim() || '(인식된 음성 없음)'}"
      `;

      templateBox.innerHTML = `💡 <b>고득점 만능 템플릿:</b><br>${currentItem.template}`;
      scoreCard.style.display = "block";

      savePteResult({
        questionId: currentItem.id,
        type: 'RL',
        title: 'RL: ' + currentItem.title,
        overall: overall,
        content: contentScore,
        fluency: fluencyScore,
        pron: pronScore,
        wpm: wpm
      });
    }

    const qBar = initDynamicQuestionBar('rl', questionSelector, (idx, item) => {
      loadRl(item);
    });

    loadRl(qBar.getCurrentItem() || PTE_QUESTION_BANK.getAll('rl')[0]);
  </script>
  <script src="ui-enhancer.js"></script>
  <script src="cloud-ai-plugin.js"></script>
</body>
</html>
